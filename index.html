<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Play Online - Telegram Video Bot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 20px;
    }

    .player-box {
      background: #111827;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    video {
      width: 100%;
      max-height: 70vh;
      border-radius: 12px;
      background: #000;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #1f2937;
      color: #d1d5db;
      display: none;
    }

    .footer {
      margin-top: 20px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="title">
      🎬 Telegram Video Player
    </div>

    <div class="subtitle">
      Play Online
    </div>

    <div class="player-box">

      <video id="videoPlayer" controls playsinline>
        Your browser does not support video playback.
      </video>

      <div id="message" class="message">
        ⚠️ Video URL नहीं मिली।
      </div>

    </div>

    <div class="footer">
      Telegram Video Bot
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const videoUrl = params.get("url");

    const player = document.getElementById("videoPlayer");
    const message = document.getElementById("message");

    if (videoUrl) {
      player.src = videoUrl;
      player.load();
    } else {
      message.style.display = "block";
    }
  </script>

</body>
</html>
