<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>NIGHT VIDEOS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #08090d;
    color: white;
    font-family: Arial, sans-serif;
}

.app {
    min-height: 100vh;
    padding: 18px;
}

.header {
    text-align: center;
    padding: 15px 0 25px;
}

.logo {
    font-size: 42px;
    margin-bottom: 5px;
}

.title {
    font-size: 27px;
    font-weight: 800;
}

.subtitle {
    color: #999;
    margin-top: 5px;
    font-size: 14px;
}

.player-box {
    width: 100%;
    background: #000;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
}

video {
    width: 100%;
    display: block;
    background: #000;
    max-height: 70vh;
}

.status {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 14px;
}

.info {
    margin-top: 18px;
    background: #15161d;
    border-radius: 16px;
    padding: 18px;
}

.info-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.info-text {
    color: #aaa;
    font-size: 14px;
    line-height: 1.5;
}

button {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 16px;
    margin-top: 18px;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: #6d28d9;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 12px;
    padding: 25px 0;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🎬</div>
        <div class="title">NIGHT VIDEOS</div>
        <div class="subtitle">Video Player Mini App</div>
    </div>

    <div class="player-box">

        <video
            id="video"
            controls
            playsinline
            webkit-playsinline
            preload="metadata">
        </video>

        <div class="status" id="status">
            Loading video...
        </div>

    </div>

    <div class="info">

        <div class="info-title">
            🎬 NIGHT VIDEOS
        </div>

        <div class="info-text">
            Enjoy your video online with the NIGHT VIDEOS
            Mini App.
        </div>

    </div>

    <button onclick="fullscreenVideo()">
        ⛶ Fullscreen
    </button>

    <div class="footer">
        NIGHT VIDEOS • Play Online
    </div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const params = new URLSearchParams(
    window.location.search
);

const fileId = params.get("file_id");

const video = document.getElementById("video");
const status = document.getElementById("status");

if (!fileId) {

    status.textContent =
        "❌ Video file not found.";

} else {

    const streamUrl =
        "/stream?file_id=" +
        encodeURIComponent(fileId);

    video.src = streamUrl;

    video.load();

    video.addEventListener("loadedmetadata", () => {

        status.textContent =
            "▶️ Ready to play";

    });

    video.addEventListener("error", () => {

        status.textContent =
            "❌ Video could not be loaded.";

    });

}

function fullscreenVideo() {

    if (video.requestFullscreen) {

        video.requestFullscreen();

    } else if (video.webkitEnterFullscreen) {

        video.webkitEnterFullscreen();

    }

}

</script>

</body>
</html>
