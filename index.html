<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>NIGHT VIDEOS - Mini App</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #0b0b12;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        .app {
            width: 100%;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #252044 0%,
                    #11101b 35%,
                    #08080d 100%
                );
        }

        /* HEADER */

        .header {
            width: 100%;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 17, 0.92);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(12px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            font-weight: 800;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #8b2cff,
                #ff176f
            );
            font-size: 20px;
        }

        .status {
            font-size: 12px;
            color: #8df5a6;
            background: rgba(60, 220, 100, 0.12);
            border: 1px solid rgba(60, 220, 100, 0.25);
            padding: 7px 10px;
            border-radius: 20px;
        }

        /* MAIN */

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 18px;
        }

        .title {
            margin-top: 8px;
            margin-bottom: 5px;
            font-size: 26px;
            font-weight: 800;
        }

        .subtitle {
            color: #a9a8b4;
            font-size: 14px;
            margin-bottom: 18px;
        }

        /* VIDEO */

        .video-card {
            width: 100%;
            background: #101018;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 15px 50px rgba(0,0,0,0.35);
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: contain;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            color: #aaa;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .play-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #8b2cff,
                #ff176f
            );
            font-size: 30px;
            padding-left: 4px;
        }

        /* INFO */

        .info {
            padding: 16px;
        }

        .video-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .video-description {
            font-size: 13px;
            color: #9d9ca8;
            line-height: 1.5;
        }

        /* BUTTON */

        .play-button {
            width: 100%;
            margin-top: 15px;
            border: 0;
            border-radius: 14px;
            padding: 16px;
            color: white;
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(
                135deg,
                #8b2cff,
                #ff176f
            );
            cursor: pointer;
            box-shadow:
                0 10px 30px rgba(139,44,255,0.25);
        }

        .play-button:active {
            transform: scale(0.98);
        }

        .play-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* LOADING */

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            color: #bdbbc8;
            font-size: 13px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* MESSAGE */

        .message {
            display: none;
            margin-top: 14px;
            padding: 13px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            background: rgba(255,255,255,0.05);
            color: #d6d5dd;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .message.error {
            color: #ff9c9c;
            background: rgba(255,70,70,0.08);
            border-color: rgba(255,70,70,0.18);
        }

        .message.success {
            color: #9cffb0;
            background: rgba(60,220,100,0.08);
            border-color: rgba(60,220,100,0.18);
        }

        /* FOOTER */

        .footer {
            text-align: center;
            padding: 35px 15px 25px;
            color: #6f6e79;
            font-size: 12px;
        }

        /* MOBILE */

        @media (max-width: 480px) {

            .container {
                padding: 14px;
            }

            .title {
                font-size: 23px;
            }

            .video-card {
                border-radius: 15px;
            }

            .play-circle {
                width: 60px;
                height: 60px;
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <div class="logo-icon">▶</div>
            <span>NIGHT VIDEOS</span>
        </div>

        <div class="status">
            ● ONLINE
        </div>

    </header>


    <!-- MAIN -->
    <main class="container">

        <div class="title">
            Video Player
        </div>

        <div class="subtitle">
            Watch your video online
        </div>


        <!-- VIDEO CARD -->
        <section class="video-card">

            <div class="video-wrapper">

                <video
                    id="videoPlayer"
                    playsinline
                    controls
                    preload="metadata"
                >
                    Your browser does not support video playback.
                </video>


                <div
                    id="placeholder"
                    class="video-placeholder"
                >

                    <div class="play-circle">
                        ▶
                    </div>

                    <div>
                        Press Play to start
                    </div>

                </div>

            </div>


            <div class="info">

                <div
                    id="videoTitle"
                    class="video-title"
                >
                    NIGHT VIDEOS
                </div>

                <div class="video-description">
                    Watch the video after the advertisement.
                </div>


                <!-- PLAY BUTTON -->
                <button
                    id="playButton"
                    class="play-button"
                >
                    ▶ WATCH VIDEO
                </button>


                <!-- LOADING -->
                <div
                    id="loading"
                    class="loading"
                >

                    <div class="spinner"></div>

                    <span id="loadingText">
                        Loading advertisement...
                    </span>

                </div>


                <!-- MESSAGE -->
                <div
                    id="message"
                    class="message"
                ></div>

            </div>

        </section>


        <div class="footer">
            NIGHT VIDEOS • Telegram Mini App
        </div>

    </main>

</div>


<script>

    /* =========================================================
       TELEGRAM MINI APP
    ========================================================= */

    const tg = window.Telegram?.WebApp;

    if (tg) {

        tg.ready();

        tg.expand();

        try {
            tg.setHeaderColor("#0b0b12");
            tg.setBackgroundColor("#0b0b12");
        } catch (e) {
            console.log("Telegram theme settings unavailable");
        }
    }


    /* =========================================================
       ADSGRAM SETTINGS
    ========================================================= */

    /*
       AdsGram Interstitial Block ID

       IMPORTANT:
       This must be your REAL AdsGram Interstitial Block ID.

       Example:
       int-12345
    */

    const ADSGRAM_BLOCK_ID = "int-44036";


    let AdController = null;


    /* =========================================================
       INITIALIZE ADSGRAM
    ========================================================= */

    function initializeAdsGram() {

        try {

            if (!window.Adsgram) {

                console.error(
                    "AdsGram SDK was not loaded."
                );

                return false;
            }


            AdController =
                window.Adsgram.init({
                    blockId: ADSGRAM_BLOCK_ID
                });


            console.log(
                "AdsGram initialized successfully."
            );

            return true;

        } catch (error) {

            console.error(
                "AdsGram initialization error:",
                error
            );

            return false;
        }
    }


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const video =
        document.getElementById("videoPlayer");

    const playButton =
        document.getElementById("playButton");

    const placeholder =
        document.getElementById("placeholder");

    const loading =
        document.getElementById("loading");

    const loadingText =
        document.getElementById("loadingText");

    const message =
        document.getElementById("message");


    /* =========================================================
       MESSAGE
    ========================================================= */

    function showMessage(
        text,
        type = ""
    ) {

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display =
            "block";
    }


    function hideMessage() {

        message.style.display =
            "none";
    }


    /* =========================================================
       LOADING
    ========================================================= */

    function showLoading(
        text
    ) {

        loadingText.textContent =
            text;

        loading.style.display =
            "flex";
    }


    function hideLoading() {

        loading.style.display =
            "none";
    }


    /* =========================================================
       VIDEO URL
    ========================================================= */

    function getVideoUrl() {

        /*
          You can open Mini App like:

          https://your-domain.com/?video=https://example.com/video.mp4
        */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const videoUrl =
            params.get("video");


        if (videoUrl) {
            return videoUrl;
        }


        /*
          Default demo video.

          Replace this URL with your own
          video URL if required.
        */

        return "";
    }


    /* =========================================================
       LOAD VIDEO
    ========================================================= */

    function loadVideo() {

        const videoUrl =
            getVideoUrl();


        if (!videoUrl) {

            placeholder.style.display =
                "flex";

            return;
        }


        video.src =
            videoUrl;

        video.load();

        placeholder.style.display =
            "flex";
    }


    /* =========================================================
       SHOW ADS
    ========================================================= */

    async function showAdvertisement() {

        hideMessage();

        showLoading(
            "Advertisement loading..."
        );


        /*
          If AdsGram SDK/controller
          is unavailable, continue video.
        */

        if (!AdController) {

            console.warn(
                "AdsGram controller unavailable."
            );

            hideLoading();

            return true;
        }


        try {

            showLoading(
                "Please wait for advertisement..."
            );


            /*
              AdsGram official API:
              AdController.show()
            */

            const result =
                await AdController.show();


            console.log(
                "AdsGram result:",
                result
            );


            hideLoading();

            return true;

        } catch (error) {

            console.error(
                "AdsGram show error:",
                error
            );


            hideLoading();


            /*
              If there is no ad available,
              allow the video to continue.
            */

            showMessage(
                "Advertisement unavailable. Starting video...",
                ""
            );


            return true;
        }
    }


    /* =========================================================
       PLAY VIDEO AFTER AD
    ========================================================= */

    async function startVideo() {

        playButton.disabled =
            true;


        hideMessage();


        /*
          STEP 1:
          Show AdsGram advertisement
        */

        await showAdvertisement();


        /*
          STEP 2:
          Start video after ad
        */

        try {

            if (!video.src) {

                showMessage(
                    "Video URL is not available.",
                    "error"
                );

                playButton.disabled =
                    false;

                return;
            }


            placeholder.style.display =
                "none";


            await video.play();


            showMessage(
                "Video started successfully.",
                "success"
            );


            setTimeout(() => {

                hideMessage();

            }, 2500);


        } catch (error) {

            console.error(
                "Video play error:",
                error
            );


            showMessage(
                "Video play nahi ho paaya. Video URL check karo.",
                "error"
            );

        }


        playButton.disabled =
            false;
    }


    /* =========================================================
       PLAY BUTTON
    ========================================================= */

    playButton.addEventListener(
        "click",
        startVideo
    );


    /* =========================================================
       VIDEO EVENTS
    ========================================================= */

    video.addEventListener(
        "play",
        () => {

            placeholder.style.display =
                "none";
        }
    );


    video.addEventListener(
        "pause",
        () => {

            if (
                video.currentTime === 0
            ) {

                placeholder.style.display =
                    "flex";
            }
        }
    );


    video.addEventListener(
        "error",
        () => {

            showMessage(
                "Video load nahi ho paaya. Video URL ya hosting check karo.",
                "error"
            );

            placeholder.style.display =
                "flex";
        }
    );


    video.addEventListener(
        "loadedmetadata",
        () => {

            console.log(
                "Video metadata loaded."
            );
        }
    );


    /* =========================================================
       INITIAL START
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            initializeAdsGram();

            loadVideo();

        }
    );

</script>

</body>
</html>
