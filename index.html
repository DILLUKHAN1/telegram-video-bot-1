<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>NIGHT VIDEOS</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: #090909;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
            padding: 20px 15px 40px;
        }

        .header {
            text-align: center;
            padding: 20px 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header p {
            margin: 8px 0 0;
            color: #aaa;
            font-size: 14px;
        }

        .card {
            background: #151515;
            border: 1px solid #282828;
            border-radius: 18px;
            padding: 18px;
            margin-top: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #0e0e0e;
            color: white;
            padding: 0 14px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #777;
        }

        button {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 12px;
            margin-top: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .play-btn {
            background: #ffffff;
            color: #000000;
        }

        .play-btn:active {
            transform: scale(0.98);
        }

        .demo-btn {
            background: #222;
            color: #fff;
            border: 1px solid #333;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #101010;
            color: #aaa;
            font-size: 13px;
            line-height: 1.5;
            display: none;
        }

        .video-box {
            margin-top: 18px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            display: none;
        }

        video {
            width: 100%;
            display: block;
            background: #000;
            max-height: 70vh;
        }

        .info {
            margin-top: 15px;
            color: #888;
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 15px;
            color: #aaa;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer {
            text-align: center;
            color: #555;
            font-size: 11px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎬 NIGHT VIDEOS</h1>
        <p>Mini App Video Player</p>
    </div>

    <div class="card">

        <label for="videoUrl">
            Video URL
        </label>

        <input
            id="videoUrl"
            type="url"
            placeholder="Paste direct video URL..."
            autocomplete="off"
        >

        <button
            id="playButton"
            class="play-btn"
            type="button"
        >
            ▶ PLAY VIDEO
        </button>

        <button
            id="demoButton"
            class="demo-btn"
            type="button"
        >
            TEST ADS
        </button>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            Preparing video...
        </div>

        <div id="status" class="status"></div>

        <div id="videoBox" class="video-box">
            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
            >
                Your browser does not support HTML5 video.
            </video>
        </div>

    </div>

    <div class="info">
        Advertisement may appear before video playback.
        <br>
        If no ad is available, the video will continue normally.
    </div>

    <div class="footer">
        NIGHT VIDEOS • Mini App
    </div>

</div>


<script>

    /* =========================================
       TELEGRAM MINI APP
    ========================================= */

    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();

        try {
            tg.setHeaderColor("#090909");
            tg.setBackgroundColor("#090909");
        } catch (e) {
            console.log("Telegram theme setup skipped");
        }
    }


    /* =========================================
       ADSGRAM CONFIGURATION
    ========================================= */

    const ADSGRAM_BLOCK_ID = "int-44048";

    let adController = null;


    function initializeAds() {

        try {

            if (!window.Adsgram) {
                console.warn("AdsGram SDK is not loaded.");
                return false;
            }

            adController = window.Adsgram.init({
                blockId: ADSGRAM_BLOCK_ID
            });

            console.log("AdsGram initialized:", ADSGRAM_BLOCK_ID);

            return true;

        } catch (error) {

            console.error(
                "AdsGram initialization error:",
                error
            );

            adController = null;

            return false;
        }
    }


    /* Initialize once */
    initializeAds();


    /* =========================================
       UI ELEMENTS
    ========================================= */

    const playButton =
        document.getElementById("playButton");

    const demoButton =
        document.getElementById("demoButton");

    const videoUrl =
        document.getElementById("videoUrl");

    const videoPlayer =
        document.getElementById("videoPlayer");

    const videoBox =
        document.getElementById("videoBox");

    const statusBox =
        document.getElementById("status");

    const loadingBox =
        document.getElementById("loading");


    /* =========================================
       STATUS FUNCTION
    ========================================= */

    function showStatus(message) {

        statusBox.style.display = "block";
        statusBox.textContent = message;

    }


    function hideStatus() {

        statusBox.style.display = "none";

    }


    /* =========================================
       LOADING
    ========================================= */

    function showLoading() {

        loadingBox.style.display = "block";

    }


    function hideLoading() {

        loadingBox.style.display = "none";

    }


    /* =========================================
       PLAY VIDEO
    ========================================= */

    async function startVideo() {

        const url = videoUrl.value.trim();

        if (!url) {

            showStatus(
                "Please paste a direct video URL first."
            );

            return;
        }


        showLoading();

        hideStatus();

        /*
         * Try to show AdsGram first.
         *
         * If an ad is available:
         *     ad appears
         *
         * If ad is unavailable/error:
         *     video still plays
         */

        try {

            if (!adController) {

                initializeAds();

            }


            if (adController) {

                showStatus(
                    "Advertisement loading..."
                );

                try {

                    await adController.show();

                    console.log(
                        "AdsGram ad finished or closed."
                    );

                } catch (adError) {

                    console.log(
                        "AdsGram unavailable:",
                        adError
                    );

                }

            }

        } catch (error) {

            console.log(
                "Advertisement error:",
                error
            );

        }


        /*
         * Continue with video
         */

        hideLoading();

        showStatus(
            "Loading video..."
        );


        try {

            videoPlayer.pause();

            videoPlayer.removeAttribute("src");

            videoPlayer.load();

            videoPlayer.src = url;

            videoBox.style.display = "block";

            videoPlayer.load();


            /*
             * Try autoplay after user interaction.
             * Since this function runs from the Play button,
             * browsers normally allow playback.
             */

            try {

                await videoPlayer.play();

                showStatus(
                    "Video is playing."
                );

            } catch (playError) {

                console.log(
                    "Autoplay blocked:",
                    playError
                );

                showStatus(
                    "Video loaded. Press ▶ on the player to start."
                );

            }

        } catch (error) {

            console.error(
                "Video loading error:",
                error
            );

            showStatus(
                "Video could not be loaded. Check the video URL."
            );

        }

    }


    /* =========================================
       PLAY BUTTON
    ========================================= */

    playButton.addEventListener(
        "click",
        startVideo
    );


    /* =========================================
       TEST ADS BUTTON
    ========================================= */

    demoButton.addEventListener(
        "click",
        async function () {

            if (!adController) {

                const initialized =
                    initializeAds();

                if (!initialized) {

                    showStatus(
                        "AdsGram SDK is not loaded."
                    );

                    return;
                }
            }


            showStatus(
                "Testing AdsGram advertisement..."
            );


            try {

                await adController.show();

                showStatus(
                    "Ad finished or closed."
                );

            } catch (error) {

                console.error(
                    "AdsGram test error:",
                    error
                );

                showStatus(
                    "No ad available right now, or the ad could not be shown."
                );

            }

        }
    );


    /* =========================================
       VIDEO EVENTS
    ========================================= */

    videoPlayer.addEventListener(
        "loadedmetadata",
        function () {

            console.log(
                "Video metadata loaded."
            );

        }
    );


    videoPlayer.addEventListener(
        "play",
        function () {

            showStatus(
                "Video is playing."
            );

        }
    );


    videoPlayer.addEventListener(
        "pause",
        function () {

            showStatus(
                "Video paused."
            );

        }
    );


    videoPlayer.addEventListener(
        "ended",
        function () {

            showStatus(
                "Video finished."
            );

        }
    );


    videoPlayer.addEventListener(
        "error",
        function () {

            showStatus(
                "Video error. Please check the video URL."
            );

        }
    );


    /* =========================================
       ENTER KEY
    ========================================= */

    videoUrl.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                startVideo();

            }

        }
    );

</script>

</body>
</html>
