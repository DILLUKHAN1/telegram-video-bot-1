<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>NIGHT VIDEOS</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app {
            width: 100%;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    rgba(50, 50, 50, 0.35),
                    transparent 35%
                ),
                #050505;
        }

        .header {
            width: 100%;
            padding: 22px 18px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(5,5,5,0.96);
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .subtitle {
            margin-top: 5px;
            color: #9c9c9c;
            font-size: 13px;
        }

        .player-section {
            width: 100%;
            padding: 18px 12px 30px;
        }

        .video-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            background: #000;
            box-shadow:
                0 10px 40px rgba(0,0,0,0.55),
                0 0 0 1px rgba(255,255,255,0.05);
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            min-height: 220px;
            max-height: 75vh;
            background: #000;
            object-fit: contain;
        }

        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 10;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .video-info {
            text-align: center;
            padding: 18px 10px 0;
        }

        .video-title {
            font-size: 18px;
            font-weight: 700;
        }

        .status {
            margin-top: 8px;
            color: #999;
            font-size: 13px;
        }

        /* ---------------- AD OVERLAY ---------------- */

        .ad-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.96);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .ad-box {
            width: 100%;
            max-width: 760px;
            text-align: center;
        }

        .ad-label {
            color: #bcbcbc;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .ad-video-wrap {
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }

        #adVideo {
            display: block;
            width: 100%;
            max-height: 70vh;
            background: #000;
        }

        .ad-countdown {
            margin-top: 14px;
            display: inline-block;
            padding: 9px 18px;
            border-radius: 30px;
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 14px;
        }

        .skip-button {
            margin-top: 14px;
            border: none;
            padding: 12px 22px;
            border-radius: 25px;
            background: #333;
            color: #aaa;
            font-size: 14px;
            cursor: not-allowed;
        }

        .skip-button.enabled {
            background: #ffffff;
            color: #000;
            cursor: pointer;
        }

        /* ---------------- ERROR ---------------- */

        .error-box {
            display: none;
            margin: 20px auto;
            max-width: 760px;
            padding: 18px;
            border-radius: 14px;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
        }

        .error-title {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .error-text {
            color: #aaa;
            font-size: 13px;
            line-height: 1.5;
        }

        .retry {
            margin-top: 14px;
            border: none;
            padding: 11px 20px;
            border-radius: 22px;
            background: #fff;
            color: #000;
            font-weight: 700;
            cursor: pointer;
        }

        /* ---------------- BOTTOM ---------------- */

        .footer {
            text-align: center;
            padding: 25px 15px 35px;
            color: #666;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            .header {
                padding-top: 18px;
            }

            .logo {
                font-size: 23px;
            }

            .player-section {
                padding: 12px 8px 25px;
            }

            .video-container {
                border-radius: 14px;
            }

            video {
                min-height: 210px;
            }

            .ad-overlay {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div class="logo">🎬 NIGHT VIDEOS</div>
        <div class="subtitle">mini app</div>
    </header>


    <!-- PLAYER -->
    <main class="player-section">

        <div class="video-container">

            <video
                id="mainVideo"
                controls
                playsinline
                webkit-playsinline
                preload="metadata"
                controlsList="nodownload"
            >
                Your browser does not support HTML5 video.
            </video>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>

        </div>


        <div class="video-info">

            <div class="video-title">
                ▶️ Play Online
            </div>

            <div class="status" id="status">
                Loading video...
            </div>

        </div>


        <div class="error-box" id="errorBox">

            <div class="error-title">
                Video could not be loaded
            </div>

            <div class="error-text" id="errorText">
                Please try again.
            </div>

            <button class="retry" onclick="retryVideo()">
                Retry
            </button>

        </div>

    </main>


    <footer class="footer">
        NIGHT VIDEOS
    </footer>

</div>


<!-- =========================
     PRE-ROLL AD
========================= -->

<div class="ad-overlay" id="adOverlay">

    <div class="ad-box">

        <div class="ad-label">
            Advertisement
        </div>

        <div class="ad-video-wrap">

            <video
                id="adVideo"
                playsinline
                webkit-playsinline
                muted
                preload="auto"
            ></video>

        </div>

        <div class="ad-countdown" id="adCountdown">
            Ad loading...
        </div>

        <br>

        <button
            class="skip-button"
            id="skipButton"
            disabled
        >
            Skip Ad
        </button>

    </div>

</div>


<script>
    /* =========================================================
       NIGHT VIDEOS MINI APP
       ========================================================= */

    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();

        try {
            tg.setHeaderColor("#050505");
            tg.setBackgroundColor("#050505");
        } catch (e) {
            console.log("Telegram theme settings unavailable");
        }
    }


    /* =========================================================
       CONFIGURATION
       ========================================================= */

    /*
       IMPORTANT:

       Yahan apna genuine VAST ad tag paste karo.

       Example:

       const VAST_AD_TAG =
           "https://YOUR-AD-NETWORK.COM/vast.xml";

       Agar abhi ad network nahi hai,
       ise empty rakho:

       const VAST_AD_TAG = "";

       Empty hone par ad nahi chalega aur
       main video directly play hoga.
    */

    const VAST_AD_TAG = "";


    /*
       Optional direct video URL.

       Normally bot se video URL query parameter ke through
       aayega.

       Example:

       https://your-domain.com/?video=https%3A%2F%2F....

       Agar query parameter nahi mila to /stream try hoga.
    */

    const DEFAULT_VIDEO_URL = "/stream";


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const mainVideo = document.getElementById("mainVideo");
    const adVideo = document.getElementById("adVideo");

    const loading = document.getElementById("loading");
    const status = document.getElementById("status");

    const errorBox = document.getElementById("errorBox");
    const errorText = document.getElementById("errorText");

    const adOverlay = document.getElementById("adOverlay");
    const adCountdown = document.getElementById("adCountdown");
    const skipButton = document.getElementById("skipButton");


    let videoURL = "";
    let adFinished = false;
    let adMinimumTime = 5;
    let adTimer = null;


    /* =========================================================
       GET VIDEO URL
       ========================================================= */

    function getVideoURL() {

        const params = new URLSearchParams(
            window.location.search
        );

        /*
           Supported parameters:

           ?video=
           ?url=
           ?file=
           ?src=
        */

        const possibleURL =
            params.get("video") ||
            params.get("url") ||
            params.get("file") ||
            params.get("src");

        if (possibleURL) {
            return possibleURL;
        }

        return DEFAULT_VIDEO_URL;
    }


    /* =========================================================
       LOAD MAIN VIDEO
       ========================================================= */

    function loadMainVideo() {

        hideError();

        loading.style.display = "flex";

        status.textContent = "Loading video...";

        videoURL = getVideoURL();

        console.log("Video URL:", videoURL);

        mainVideo.src = videoURL;

        mainVideo.load();

        mainVideo.addEventListener(
            "loadedmetadata",
            function onLoaded() {

                loading.style.display = "none";

                status.textContent = "Ready to play";

                mainVideo.removeEventListener(
                    "loadedmetadata",
                    onLoaded
                );

            }
        );

        mainVideo.addEventListener(
            "canplay",
            function onCanPlay() {

                loading.style.display = "none";

                status.textContent = "Ready";

                mainVideo.removeEventListener(
                    "canplay",
                    onCanPlay
                );

            }
        );

        mainVideo.addEventListener(
            "error",
            function onVideoError() {

                loading.style.display = "none";

                showError(
                    "The video could not be loaded. Please check the stream URL or try again."
                );

            }
        );
    }


    /* =========================================================
       START PLAY FLOW
       ========================================================= */

    async function startPlayback() {

        /*
           If VAST ad tag is configured,
           show ad first.
        */

        if (VAST_AD_TAG && VAST_AD_TAG.trim() !== "") {

            const adLoaded =
                await loadVASTAd(VAST_AD_TAG);

            if (adLoaded) {

                showAd();

                return;
            }
        }

        /*
           No ad / ad failed:
           play main video.
        */

        playMainVideo();
    }


    /* =========================================================
       PLAY MAIN VIDEO
       ========================================================= */

    function playMainVideo() {

        adOverlay.style.display = "none";

        loading.style.display = "none";

        status.textContent = "Playing";

        mainVideo.play().catch(function(error) {

            console.log(
                "Autoplay blocked:",
                error
            );

            status.textContent =
                "Tap the play button to start";
        });
    }


    /* =========================================================
       VAST AD LOADER
       ========================================================= */

    async function loadVASTAd(vastURL) {

        try {

            const response =
                await fetch(vastURL, {
                    method: "GET",
                    mode: "cors",
                    cache: "no-store"
                });

            if (!response.ok) {

                console.log(
                    "VAST request failed:",
                    response.status
                );

                return false;
            }

            const xmlText =
                await response.text();

            const parser =
                new DOMParser();

            const xml =
                parser.parseFromString(
                    xmlText,
                    "text/xml"
                );

            /*
               Look for MediaFile.
            */

            const mediaFiles =
                xml.getElementsByTagName(
                    "MediaFile"
                );

            if (!mediaFiles.length) {

                console.log(
                    "No MediaFile found in VAST"
                );

                return false;
            }


            /*
               Prefer MP4.
            */

            let selectedURL = "";

            for (
                let i = 0;
                i < mediaFiles.length;
                i++
            ) {

                const media =
                    mediaFiles[i];

                const type =
                    (
                        media.getAttribute("type") ||
                        ""
                    ).toLowerCase();

                const url =
                    media.textContent.trim();

                if (
                    type.includes("mp4") &&
                    url
                ) {

                    selectedURL = url;

                    break;
                }
            }


            /*
               Fallback to first media file.
            */

            if (!selectedURL) {

                selectedURL =
                    mediaFiles[0]
                        .textContent
                        .trim();
            }


            if (!selectedURL) {

                return false;
            }


            /*
               Set ad video.
            */

            adVideo.src = selectedURL;

            adVideo.load();

            return true;

        } catch (error) {

            console.error(
                "VAST error:",
                error
            );

            return false;
        }
    }


    /* =========================================================
       SHOW AD
       ========================================================= */

    function showAd() {

        adFinished = false;

        adOverlay.style.display =
            "flex";

        skipButton.disabled = true;

        skipButton.classList.remove(
            "enabled"
        );

        skipButton.textContent =
            "Skip Ad";

        adCountdown.textContent =
            "Advertisement";

        /*
           Main video must remain paused
           until ad completes.
        */

        mainVideo.pause();


        /*
           Start muted because
           mobile browsers generally block
           autoplay with sound.
        */

        adVideo.muted = true;

        adVideo.currentTime = 0;


        /*
           Try autoplay.
        */

        adVideo.play()
            .then(function() {

                startAdCountdown();

            })
            .catch(function(error) {

                console.log(
                    "Ad autoplay blocked:",
                    error
                );

                adCountdown.textContent =
                    "Tap to start advertisement";

                adOverlay.addEventListener(
                    "click",
                    startAdAfterTap,
                    { once: true }
                );
            });
    }


    /* =========================================================
       START AD AFTER USER TAP
       ========================================================= */

    function startAdAfterTap(event) {

        if (
            event.target ===
            skipButton
        ) {
            return;
        }

        adVideo.play()
            .then(function() {

                startAdCountdown();

            })
            .catch(function(error) {

                console.log(error);
            });
    }


    /* =========================================================
       AD COUNTDOWN
       ========================================================= */

    function startAdCountdown() {

        clearInterval(adTimer);

        const duration =
            adVideo.duration;

        let remaining =
            Math.max(
                adMinimumTime,
                isFinite(duration)
                    ? Math.ceil(duration)
                    : adMinimumTime
            );

        adCountdown.textContent =
            "Ad: " + remaining + "s";


        adTimer = setInterval(function() {

            if (
                adVideo.currentTime >=
                adMinimumTime
            ) {

                skipButton.disabled = false;

                skipButton.classList.add(
                    "enabled"
                );

                skipButton.textContent =
                    "Skip Ad";
            }


            const left =
                Math.max(
                    0,
                    Math.ceil(
                        (
                            adVideo.duration ||
                            adMinimumTime
                        ) -
                        adVideo.currentTime
                    )
                );


            adCountdown.textContent =
                "Ad: " + left + "s";


        }, 250);
    }


    /* =========================================================
       AD ENDED
       ========================================================= */

    adVideo.addEventListener(
        "ended",
        function() {

            finishAd();

        }
    );


    /* =========================================================
       SKIP AD
       ========================================================= */

    skipButton.addEventListener(
        "click",
        function() {

            if (
                !skipButton.disabled
            ) {

                finishAd();

            }

        }
    );


    /* =========================================================
       FINISH AD
       ========================================================= */

    function finishAd() {

        if (adFinished) {
            return;
        }

        adFinished = true;

        clearInterval(adTimer);

        adVideo.pause();

        adOverlay.style.display =
            "none";

        playMainVideo();
    }


    /* =========================================================
       MAIN VIDEO EVENTS
       ========================================================= */

    mainVideo.addEventListener(
        "play",
        function() {

            status.textContent =
                "Playing";

            loading.style.display =
                "none";
        }
    );


    mainVideo.addEventListener(
        "pause",
        function() {

            if (
                !mainVideo.ended
            ) {

                status.textContent =
                    "Paused";
            }
        }
    );


    mainVideo.addEventListener(
        "waiting",
        function() {

            loading.style.display =
                "flex";

            status.textContent =
                "Buffering...";
        }
    );


    mainVideo.addEventListener(
        "playing",
        function() {

            loading.style.display =
                "none";

            status.textContent =
                "Playing";
        }
    );


    mainVideo.addEventListener(
        "ended",
        function() {

            status.textContent =
                "Video ended";
        }
    );


    /* =========================================================
       ERROR HANDLING
       ========================================================= */

    function showError(message) {

        errorBox.style.display =
            "block";

        errorText.textContent =
            message;

        status.textContent =
            "Unable to play video";
    }


    function hideError() {

        errorBox.style.display =
            "none";
    }


    function retryVideo() {

        loadMainVideo();

        setTimeout(function() {

            startPlayback();

        }, 500);
    }


    /* =========================================================
       DISABLE LONG PRESS / CONTEXT MENU
       ========================================================= */

    document.addEventListener(
        "contextmenu",
        function(event) {

            event.preventDefault();

        }
    );


    /* =========================================================
       PREVENT ACCIDENTAL DOUBLE TAP ZOOM
       ========================================================= */

    let lastTouchEnd = 0;

    document.addEventListener(
        "touchend",
        function(event) {

            const now =
                Date.now();

            if (
                now - lastTouchEnd <= 300
            ) {

                event.preventDefault();
            }

            lastTouchEnd = now;

        },
        false
    );


    /* =========================================================
       PAGE START
       ========================================================= */

    window.addEventListener(
        "load",
        function() {

            loadMainVideo();

            /*
               We don't automatically force
               playback with sound.

               User can tap Play.
            */

            setTimeout(function() {

                if (
                    VAST_AD_TAG &&
                    VAST_AD_TAG.trim() !== ""
                ) {

                    /*
                       Ads start when user interacts
                       with the player.
                    */

                    mainVideo.addEventListener(
                        "play",
                        function firstPlay() {

                            mainVideo.pause();

                            mainVideo.removeEventListener(
                                "play",
                                firstPlay
                            );

                            startPlayback();

                        },
                        { once: true }
                    );

                }

            }, 500);

        }
    );


    /* =========================================================
       TELEGRAM MINI APP BACK BUTTON
       ========================================================= */

    if (tg) {

        try {

            tg.BackButton.show();

            tg.BackButton.onClick(
                function() {

                    tg.close();

                }
            );

        } catch (error) {

            console.log(
                "Telegram BackButton unavailable"
            );

        }
    }

</script>

</body>
</html>
